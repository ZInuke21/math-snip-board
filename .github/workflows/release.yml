# Builds MathSnipBoard.exe on real Windows, runs the self-test, and publishes a GitHub Release.
# Start it from the Actions tab ("Run workflow", type a version + what's new) or by pushing a tag like v2.2.0.
# Every installed copy of the app picks the new release up through its updater.
name: Build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "New version number, e.g. 2.2.0 (must be higher than the last one)"
        required: true
      notes:
        description: "What's new - shown to the teacher. Separate items with ;  e.g. Fixed eraser lag; Added purple"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag notes
        shell: pwsh
        run: git fetch --force --tags

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $v = "${{ inputs.version }}".Trim().TrimStart('v','V') }
          else { $v = "${{ github.ref_name }}".TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 2.2.0 (got '$v')" }
          "tag=v$v" >> $env:GITHUB_OUTPUT
          (Get-Content src/Version.cs) -replace 'Version\("[0-9.]+"\)', "Version(""$v.0"")" | Set-Content src/Version.cs
          Select-String -Path src/Version.cs -Pattern 'AssemblyVersion'

      - name: Make sure this version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.ver.outputs.tag }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release ${{ steps.ver.outputs.tag }} already exists - pick a higher version" }
          $global:LASTEXITCODE = 0

      - name: Build with the Windows .NET Framework compiler
        shell: cmd
        run: build.cmd

      - name: Self-test on Windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\MathSnipBoard.exe -ArgumentList '--selftest', "`"$PWD\selftest`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Self-test timed out" }
          if (Test-Path selftest\selftest.log) { Get-Content selftest\selftest.log }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }

      - name: Updater can reach GitHub
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\MathSnipBoard.exe -ArgumentList '--update-check', "`"$PWD\update-check.txt`"" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Update check timed out" }
          Get-Content update-check.txt
          if ($p.ExitCode -ne 0) { throw "Update check failed" }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MathSnipBoard
          path: MathSnipBoard.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          Compress-Archive -Path MathSnipBoard.exe -DestinationPath MathSnipBoard.zip -Force
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $items = "$env:NOTES" -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
            if ($items) { ($items | ForEach-Object { "* $_" }) -join "`n" | Set-Content notes.md -Encoding utf8 }
            else { "* Improvements and fixes" | Set-Content notes.md -Encoding utf8 }
            gh release create $tag MathSnipBoard.exe MathSnipBoard.zip --target "${{ github.sha }}" --title "Math Snip Board $tag" --notes-file notes.md
          } else {
            gh release create $tag MathSnipBoard.exe MathSnipBoard.zip --title "Math Snip Board $tag" --notes-from-tag
          }
